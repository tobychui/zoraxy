name: Linux packages (deb, rpm)

on:
  release:
    types: [released, prereleased]
  pull_request:
    paths:
      - 'packaging/linux/**'
      - '.github/workflows/linux-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build packages
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make -C packaging/linux packages ARCH=${{ matrix.arch }} ${TAG:+VERSION=${TAG#v}}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: packaging/linux/dist/*
          if-no-files-found: error

  test-deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages-amd64

      - name: Install and start the service
        run: |
          sudo apt-get install -y ./zoraxy_*_amd64.deb
          sudo systemctl enable --now zoraxy
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
          curl -fsS -o /dev/null -w "management UI: %{http_code}\n" http://127.0.0.1:8000/
          systemctl is-active zoraxy
          sudo ls /var/lib/zoraxy

      - name: Reinstall keeps the local configuration
        run: |
          echo '# local change' | sudo tee -a /etc/default/zoraxy
          sudo apt-get install -y --reinstall ./zoraxy_*_amd64.deb
          grep -q 'local change' /etc/default/zoraxy
          systemctl is-active zoraxy

      - name: Remove
        run: |
          sudo apt-get purge -y zoraxy
          if systemctl is-active --quiet zoraxy; then exit 1; fi
          test ! -e /usr/bin/zoraxy

  test-rpm:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['oraclelinux:8', 'oraclelinux:9', 'fedora:latest']
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages-amd64

      - name: Install, run and remove in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/p:ro" ${{ matrix.image }} bash -euxc '
            dnf install -y /p/zoraxy-*.x86_64.rpm
            rpm -V zoraxy
            id zoraxy
            test "$(stat -c %U:%a /var/lib/zoraxy)" = zoraxy:750
            command -v setpriv >/dev/null || dnf install -y -q util-linux
            cd /var/lib/zoraxy
            setpriv --reuid zoraxy --regid zoraxy --init-groups /usr/bin/zoraxy -mdns=false -default_inbound_enabled=false >/tmp/zoraxy.log 2>&1 &
            for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
            curl -fsS -o /dev/null -w "management UI: %{http_code}\n" http://127.0.0.1:8000/ || { cat /tmp/zoraxy.log; exit 1; }
            kill %1; wait || true
            dnf remove -y zoraxy
            test ! -e /usr/bin/zoraxy
          '

  release:
    if: github.event_name == 'release'
    needs: [test-deb, test-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
