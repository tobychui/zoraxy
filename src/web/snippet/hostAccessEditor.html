<!DOCTYPE html>
<html>
    <head>
        <!-- Notes: This should be open in its original path-->
        <meta charset="utf-8">
        <meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
        <link rel="stylesheet" href="../script/semantic/semantic.min.css">
        <script src="../script/jquery-3.6.0.min.js"></script>
        <script src="../script/semantic/semantic.min.js"></script>
        <script src="../script/utils.js"></script>
        <style>
            .accessRule{
                cursor: pointer;
                border-radius: 0.4em !important;
                border: 1px solid rgb(233, 233, 233) !important;
            }

            .accessRule:hover{
                background-color: rgb(241, 241, 241) !important;
            }

            .accessRule.active{
                background-color: rgb(241, 241, 241) !important;
            }

            .accessRule .selected{
                position: absolute;
                top: 1em;
                right: 0.6em;
            }

            .accessRule:not(.active) .selected{
                display:none;
            }

            #accessRuleList{
                padding: 0.6em;
                /* border: 1px solid rgb(228, 228, 228); */
                border-radius: 0.4em !important;
                max-height: calc(100vh - 15em);
                min-height: 300px;
                overflow-y: auto;
            }

            body.darkTheme #accessRuleList{
                border: 1px solid rgb(50, 50, 50) !important;

            }

            body.darkTheme .ui.segment.accessRule {
                border: 1px solid var(--theme_bg_secondary) !important;
            }

            body.darkTheme .ui.segment.accessRule:hover {
                background-color: var(--theme_bg_secondary) !important;
            }

            body.darkTheme .ui.segment.accessRule.active {
                background-color: var(--theme_bg_secondary) !important;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="../darktheme.css">
        <script src="../script/darktheme.js"></script>
        <br>
        <div class="ui container">
            <p>Select an access rule to apply blacklist / whitelist filtering</p>
            <div id="accessRuleList">
                <div class="ui segment accessRule">
                    <div class="ui header">
                        <i class="filter icon"></i>
                        <div class="content">
                            Account Settings
                            <div class="sub header">Manage your preferences</div>
                        </div>
                    </div>
                </div>
            </div>
            <h3 class="ui dividing header">Path-Based Access Rules</h3>
            <div class="scrolling content ui form">
                <table class="ui basic very compact unstackable celled table">
                    <thead>
                        <tr>
                            <th>Path</th>
                            <th>Access Rule</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pathBasedAccessRulesTable">
                    <!-- Rows will be dynamically populated -->
                    </tbody>
                </table>
            </div>
            <div class="ui divider"></div>
            <div class="ui form">
                <div class="three small fields">
                    <div class="field">
                        <label for="newPath">Path</label>
                        <input type="text" id="newPath" placeholder="/admin/*">
                    </div>
                    <div class="field">
                        <label for="newPathRuleAccessDropdown">Access Rule</label>
                        <div class="ui selection dropdown">
                            <input type="hidden" id="newPathRuleAccessDropdown" value="default">
                            <i class="dropdown icon"></i>
                            <div class="default text">Default</div>
                            <div class="menu" id="newPathRuleAccessList">
                                <div class="item" data-value="default"><i class="ui yellow star icon"></i> Default</div>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <button class="ui basic button" onclick="addPathBasedAccessRule()">
                            <i class="green add icon"></i> Add
                        </button>
                    </div>
                </div>
            </div>
            <br>
            <!-- <button class="ui basic button" onclick="applyChange()"><i class="ui green check icon"></i> Apply Change</button> -->
            <br><br><br>

        </div>
        <script>
            let editingEndpoint = {};
            let pathBasedRules = [];
            let accessRuleList = [];

            if (window.location.hash.length > 1){
                let payloadHash = window.location.hash.substr(1);
                try{
                    payloadHash = JSON.parse(decodeURIComponent(payloadHash));
                    $("#epname").text(payloadHash.ep);
                    editingEndpoint = payloadHash;
                }catch(ex){
                    console.log("Unable to load endpoint data from hash")
                }
            }

            function initAccessRuleList(callback = undefined){
                $("#accessRuleList").html("<small>Loading</small>");
                $.get("/api/access/list", function(data){
                    if (data.error == undefined){
                        $("#accessRuleList").html("");
                        $("#newPathRuleAccessList").html("");
                        data.forEach(function(rule){
                            let icon = `<i class="ui grey filter icon"></i>`;
                            if (rule.ID == "default"){
                                icon = `<i class="ui yellow star icon"></i>`;
                            }else if (rule.BlacklistEnabled && !rule.WhitelistEnabled){
                                //This is a blacklist filter
                                icon = `<i class="ui red filter icon"></i>`;
                            }else if (rule.WhitelistEnabled && !rule.BlacklistEnabled){
                                //This is a whitelist filter
                                icon = `<i class="ui green filter icon"></i>`;
                            }else if (rule.WhitelistEnabled && rule.BlacklistEnabled){
                                //Whitelist and blacklist filter
                                icon = `<i class="ui yellow filter icon"></i>`;
                            }

                            $("#accessRuleList").append(`<div class="ui basic segment accessRule" ruleid="${rule.ID}" onclick="selectThisRule(this);">
                                <h5 class="ui header">
                                    ${icon}
                                    <div class="content">
                                        ${rule.Name}
                                        <div class="sub header">${rule.ID}</div>
                                    </div>
                                </h5>
                                <p>${rule.Desc}</p>
                                ${rule.BlacklistEnabled?`<small><i class="ui red filter icon"></i> Blacklist Enabled</small>`:""}
                                ${rule.WhitelistEnabled?`<small><i class="ui green filter icon"></i> Whitelist Enabled</small>`:""}
                                <div class="selected"><i class="ui large green check icon"></i></div>
                            </div>`);
                            $("#newPathRuleAccessList").append(`<div class="item" data-value="${rule.ID}">${icon} ${rule.Name}</div>`);
                        });
                        $("#newPathRuleAccessDropdown").parent().dropdown();
                        accessRuleList = data;
                        $(".dropdown").dropdown();
                        if (callback != undefined){
                            callback();
                        }
                    }
                });
            }

            initAccessRuleList(function(){
                $.cjax({
                    url: "/api/proxy/detail",
                    method: "POST",
                    data: {"type":"host", "epname": editingEndpoint.ep },
                    success: function(data){
                        console.log(data);
                        if (data.error != undefined){
                            alert(data.error);
                        }else{
                            let currentAccessFilter = data.AccessFilterUUID;
                            if (currentAccessFilter == ""){
                                //Use default
                                currentAccessFilter = "default";
                            }

                            $(`.accessRule[ruleid=${currentAccessFilter}]`).addClass("active");

                            if(data.PathBasedAccessRules){
                                pathBasedRules = data.PathBasedAccessRules;
                                renderPathBasedAccessRules();
                            }
                        }
                    }
                })
            });


            function selectThisRule(accessRuleObject){
                let accessRuleID = $(accessRuleObject).attr("ruleid");
                $(".accessRule").removeClass('active');
                $(accessRuleObject).addClass('active');

                //Updates 2025-06-10: Added auto save on change feature
                applyChange("Access Rule Updated");
            }


            function applyChange(message){
                let newAccessRuleID = $(".accessRule.active").attr("ruleid");
                let targetEndpoint = editingEndpoint.ep;
                $.cjax({
                    url: "/api/access/attach",
                    method: "POST",
                    data: {
                        id: newAccessRuleID,
                        host: targetEndpoint,
                        pathBasedRules: JSON.stringify(pathBasedRules)
                    },
                    success: function(data){
                        if (data.error != undefined){
                            parent.msgbox(data.error, false);
                        }else{
                            parent.msgbox(message);

                            //Modify the parent list if exists
                            if (parent != undefined && parent.updateAccessRuleNameUnderHost){
                                parent.updateAccessRuleNameUnderHost(targetEndpoint, newAccessRuleID);
                            }
                        }
                    }
                });
            }

            function applyChangeAndClose(){
                let newAccessRuleID = $(".accessRule.active").attr("ruleid");
                let targetEndpoint = editingEndpoint.ep;
                $.cjax({
                    url: "/api/access/attach",
                    method: "POST",
                    data: {
                        id: newAccessRuleID,
                        host: targetEndpoint,
                        pathBasedRules: JSON.stringify(pathBasedRules)
                    },
                    success: function(data){
                        if (data.error != undefined){
                            parent.msgbox(data.error, false);
                        }else{
                            parent.msgbox("Access Rule Updated");

                            //Modify the parent list if exists
                            if (parent != undefined && parent.updateAccessRuleNameUnderHost){
                                parent.updateAccessRuleNameUnderHost(targetEndpoint, newAccessRuleID);
                            }
                            parent.hideSideWrapper();
                        }
                    }
                })
            }

            function addPathBasedAccessRule() {
                let path = $('#newPath').val().trim();
                let accessRuleId = $('#newPathRuleAccessDropdown').val().trim();
                if (path && accessRuleId) {
                    pathBasedRules.push({ Path: path, RuleID: accessRuleId });
                    renderPathBasedAccessRules();
                    applyChange("Added path access");
                    $('#newPath').val('');
                    $('#newPathRuleAccessDropdown').dropdown('clear');

                    $('#newPath').parent().removeClass("error")
                } else {
                    $('#newPath').parent().addClass("error")
                }
            }

            function removePathBasedAccessRule(index) {
                pathBasedRules.splice(index, 1);
                renderPathBasedAccessRules();
                applyChange("Path access removed");
            }

            function renderPathBasedAccessRules() {
                let tableBody = $('#pathBasedAccessRulesTable');
                tableBody.empty();
                pathBasedRules.forEach((rule, index) => {
                    const domain = editingEndpoint.ep
                    let domainLink = `<a href="//${domain}${rule.Path}" target="_blank">${rule.Path}</a>`
                    if (domain.includes("*")){
                        domainLink = rule.Path;
                    }

                    let accessRule = accessRuleList.find(r => r.ID === rule.RuleID);
                    let accessRuleName = accessRule ? accessRule.Name : 'N/A';
                    let row = `<tr>
                        <td>${domainLink}</td>
                        <td>${accessRuleName}</td>
                        <td><button class="ui basic mini circular icon button" onclick="removePathBasedAccessRule('${index}');"><i class="red trash icon"></i></button></td>
                    </tr>`;
                    tableBody.append(row);
                });
            }
          
        </script>
    </body>
</html>
